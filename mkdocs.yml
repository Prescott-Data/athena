      - Retrieving Context: guides/retrieving-context.md
      - Semantic Search: guides/semantic-search.md
      - Go SDK: guides/go-sdk.md
      - Using the REST API: guides/rest-api.md
      - Enabling Authentication: guides/authentication.md
      - LLM Providers: guides/llm-providers.md
      - Blob Storage: guides/blob-storage.md
