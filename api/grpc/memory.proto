syntax = "proto3";

package memory.v1;

option go_package = "bitbucket.org/dromos/athena-memos/api/grpc/gen;gen";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Memory Operating System Service
service MemoryService {
  // Session Management
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/sessions"
      body: "*"
    };
  }
  
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions/{session_id}"
    };
  }
  
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/sessions/{session_id}"
    };
  }

  // Memory Operations
  // Erases all memory of a tenant's user, a user's agent, or a whole tenant.
  rpc EraseMemory(EraseMemoryRequest) returns (EraseMemoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/memory/erase"
      body: "*"
    };
  }

  rpc StoreInteraction(StoreInteractionRequest) returns (StoreInteractionResponse) {
    option (google.api.http) = {
      post: "/api/v1/sessions/{session_id}/interactions"
      body: "*"
    };
  }

  rpc StoreEvent(StoreEventRequest) returns (StoreEventResponse) {
    option (google.api.http) = {
      post: "/api/v1/sessions/{session_id}/events"
      body: "*"
    };
  }
  
  rpc GetContext(GetContextRequest) returns (GetContextResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions/{session_id}/context"
    };
  }
  
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/sessions/{session_id}/context/search"
      body: "*"
    };
  }

  // Analysis & Intelligence
  rpc AnalyzeTopics(AnalyzeTopicsRequest) returns (AnalyzeTopicsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions/{session_id}/analysis/topics"
    };
  }
  
  rpc GetHeatMetrics(GetHeatMetricsRequest) returns (GetHeatMetricsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions/{session_id}/analysis/heat"
    };
  }
  
  rpc GetSegments(GetSegmentsRequest) returns (GetSegmentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions/{session_id}/segments"
    };
  }

  // Health & Operations
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/api/v1/health"
    };
  }

  // Admin / Testing
  rpc TriggerGraphAnalytics(TriggerGraphAnalyticsRequest) returns (TriggerGraphAnalyticsResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/analytics/trigger"
    };
  }
}

// Request/Response Messages

message CreateSessionRequest {
  string tenant_id = 1;
  string user_id = 2;
  string agent_id = 3;
  map<string, string> metadata = 4;
}

message CreateSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {
  bool success = 1;
  // What was removed: the session's STM entries, its stored events, the MTM chains
  // summarised from them (a chain shared with other sessions is removed whole), the
  // vectors of those chains and events, and the events' blob payloads.
  int32 stm_events_deleted = 2;
  int32 events_deleted = 3;
  int32 chains_deleted = 4;
  int32 vectors_deleted = 5;
  int32 blobs_deleted = 6;
  // LTM graph nodes and edges removed because no remaining chain supports them.
  int32 ltm_entries_deleted = 7;
}

// Erases a tenant's user, a user's agent, or (with user_id empty) a whole tenant.
message EraseMemoryRequest {
  string tenant_id = 1;
  string user_id = 2;
  string agent_id = 3;
}

message EraseMemoryResponse {
  bool success = 1;
  int32 sessions_deleted = 2;
  int32 stm_events_deleted = 3;
  int32 events_deleted = 4;
  int32 chains_deleted = 5;
  int32 vectors_deleted = 6;
  int32 blobs_deleted = 7;
  int32 ltm_entries_deleted = 8;
}

message StoreInteractionRequest {
  string session_id = 1;
  string user_message = 2;
  string agent_response = 3;
  map<string, string> metadata = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message StoreInteractionResponse {
  bool success = 1;
  string interaction_id = 2;
}

message StoreEventRequest {
  string session_id = 1;
  string role = 2;        // "user", "agent", "system"
  string type = 3;        // "message", "thought", "action", "observation"
  string content = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp timestamp = 6;
  bytes payload = 7;
  string mime_type = 8;
}

message StoreEventResponse {
  bool success = 1;
  string event_id = 2;
}

message GetContextRequest {
  string session_id = 1;
  int32 limit = 2;
  bool include_segments = 3;
  // When set, MTM chains are retrieved via semantic vector search instead of
  // recency sort. Pass the current user message for per-message (Phase 2) retrieval.
  string query = 4;
}

message GetContextResponse {
  // Recent STM events (all types: message, thought, action, observation).
  repeated STMEvent stm_events = 1;
  repeated DialoguePage relevant_pages = 2;
  repeated Segment segments = 3;
  UserPersona user_persona = 4;
  // LTPM context — Long-Term Persistent Memory retrieved from ArangoDB knowledge graph.
  LTPMContext ltpm = 5;
}

// LTPMContext holds Long-Term Persistent Memory retrieval results from the ArangoDB knowledge graph.
// Contains entities, relationships, and persona data extracted and promoted from MTM cognitive chains.
message LTPMContext {
  string status = 1;
}

message SearchMemoryRequest {
  string session_id = 1;
  string query = 2;
  int32 limit = 3;
  double similarity_threshold = 4;
  // Optional metadata filters — only chains whose metadata matches all provided
  // key/value pairs are returned (e.g. {"origin_service": "colabra"}).
  map<string, string> filter = 5;
}

message SearchMemoryResponse {
  repeated SearchResult results = 1;
}

message AnalyzeTopicsRequest {
  string session_id = 1;
}

message AnalyzeTopicsResponse {
  repeated TopicSummary topics = 1;
}

message GetHeatMetricsRequest {
  string session_id = 1;
}

message GetHeatMetricsResponse {
  HeatMetrics heat_metrics = 1;
}

message GetSegmentsRequest {
  string session_id = 1;
  int32 limit = 2;
}

message GetSegmentsResponse {
  repeated Segment segments = 1;
}

message HealthCheckRequest {
}

message HealthCheckResponse {
  string status = 1;
  map<string, string> dependencies = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Data Models

message Session {
  string session_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  // Time of the session's most recent stored event, or created_at if it has none.
  google.protobuf.Timestamp updated_at = 4;
  map<string, string> metadata = 5;
  string tenant_id = 6;
  string agent_id = 7;
  string status = 8;
  // Number of events stored through the session.
  int32 event_count = 9;
}

message STMEvent {
  // Who generated this event (user, agent, system).
  string role = 1;
  // Event type (message, thought, action, observation).
  string type = 2;
  // The event content.
  string content = 3;
  // When the event occurred.
  google.protobuf.Timestamp timestamp = 4;
  // Optional metadata (origin_service, workflow_id, etc.).
  map<string, string> metadata = 5;
  // External blob storage pointer if the payload was massive.
  string blob_uri = 6;
  string blob_mime_type = 7;
}

message DialoguePage {
  string id = 1;
  string session_id = 2;
  // The topic/title of this cognitive chain.
  string topic = 3;
  // LLM-generated summary of the chain.
  string summary = 4;
  google.protobuf.Timestamp timestamp = 5;
  repeated double embedding = 6;
  map<string, string> metadata = 7;
}

message Segment {
  string id = 1;
  string session_id = 2;
  string content = 3;
  repeated string topics = 4;
  HeatFactors heat_factors = 5;
  double quality_score = 6;
  google.protobuf.Timestamp created_at = 7;
  // Current heat of the segment (heat decays with time since last access).
  double heat = 8;
  int32 event_count = 9;
  google.protobuf.Timestamp last_event_at = 10;
}

// Heat follows the Ebbinghaus forgetting curve:
// heat = base_importance * time_decay, where time_decay = exp(-hours_since_access / (tau * recall_strength)).
message HeatFactors {
  // Fields 1-5 were never populated; heat is described by fields 6-8.
  double access_frequency = 1 [deprecated = true];
  double interaction_depth = 2 [deprecated = true];
  double recency_score = 3 [deprecated = true];
  double user_engagement = 4 [deprecated = true];
  double topic_importance = 5 [deprecated = true];
  // Importance of the content: intrinsic importance plus contextual density, capped at 1.
  double base_importance = 6;
  // Forgetting-curve factor in (0, 1]; 1 means just accessed.
  double time_decay = 7;
  // Grows each time the memory is recalled, which slows decay.
  double recall_strength = 8;
}

message UserPersona {
  string user_id = 1;
  map<string, double> personality_traits = 2;
  repeated string interests = 3;
  map<string, string> preferences = 4;
}

message TopicSummary {
  string topic = 1;
  double confidence = 2;
  int32 frequency = 3;
  google.protobuf.Timestamp last_mentioned = 4;
}

message HeatMetrics {
  // Mean current heat of the session's segments.
  double overall_heat = 1;
  // Mean of each heat factor across the session's segments.
  HeatFactors breakdown = 2;
  // Number of events stored through the session.
  int32 total_interactions = 3;
  google.protobuf.Timestamp last_activity = 4;
  int32 segment_count = 5;
  // Heat of the session's hottest segment.
  double max_heat = 6;
}

message SearchResult {
  string content = 1;
  double similarity_score = 2;
  string source_type = 3; // "dialogue_page", "segment", etc.
  string source_id = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message TriggerGraphAnalyticsRequest {}

message TriggerGraphAnalyticsResponse {
  bool success = 1;
  string message = 2;
}
